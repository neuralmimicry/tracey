id: seeded-credential-and-data-staging
name: Seeded credential misuse and synthetic data staging
objective:
  description: >
    Authorised lab-only scenario used by red_team to emit typed synthetic
    adversary-emulation evidence that Tracey can display and correlate.
preconditions:
  - lab network isolated
  - target snapshot completed
  - synthetic credentials loaded
  - synthetic files installed
  - Tracey sensor health checks passing
allowed_actions:
  - ObserveAsset
  - ObserveService
  - TestSeededCredential
  - RequestSyntheticFile
  - StageSyntheticDataset
  - TransferSyntheticDatasetToSink
targets:
  - host: web-application
    ip: 10.77.0.30
    role: application
    labels: [lab, target]
  - host: file-server
    ip: 10.77.0.25
    role: file_service
    labels: [lab, synthetic_data]
  - host: evidence-sink
    ip: 10.77.0.60
    role: evidence_sink
    labels: [lab, sink]
success_conditions:
  red_team:
    - synthetic files staged
  tracey:
    - suspicious authentication correlated
    - staging behaviour detected
    - response proposed
    - evidence retained
stop_conditions:
  - policy violation
  - target outside allowlist
  - scenario timeout
  - operator kill switch
  - service health below threshold
maximum_duration_minutes: 20
cleanup:
  - remove synthetic markers
  - restore lab snapshot
  - seal evidence bundle
